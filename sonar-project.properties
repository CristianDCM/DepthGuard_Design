# Configuración de SonarCloud.
# Rellena projectKey y organization con los valores que aparecen en
# SonarCloud > Information (menú inferior izquierdo) antes de activar
# el secreto SONAR_TOKEN.
sonar.projectKey=
sonar.organization=

sonar.projectName=DepthGuard Admin
sonar.sources=src,supabase/functions
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.ts
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
