# Análisis de calidad con SonarCloud.
#
# El análisis solo se ejecuta si el repositorio tiene configurado el secreto
# SONAR_TOKEN. Sin él, el paso se omite con un aviso en lugar de fallar:
# antes este workflow fallaba en cada push porque venía de la plantilla de
# GitHub con projectKey y organization vacíos.
#
# Para activarlo:
#   1. Importar el proyecto en https://sonarcloud.io
#   2. Copiar la Project Key y la Organization Key en sonar-project.properties
#   3. Crear el secreto SONAR_TOKEN en Settings > Secrets and variables > Actions
name: SonarCloud

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  analysis:
    name: Análisis SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Descargar el repositorio
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v5
        with:
          # Historial completo: SonarCloud lo usa para atribuir cada hallazgo.
          fetch-depth: 0

      - name: Analizar con SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6

      - name: Análisis omitido
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::notice title=SonarCloud omitido::El secreto SONAR_TOKEN no está configurado. Consulta las instrucciones en .github/workflows/sonarcloud.yml"
