<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DepthGuard</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
</head>

<body>
  <div id="root"></div>
  <!--
    Captura el hash de autenticación de Supabase ANTES de que la app cargue.
    Supabase JS client borra el hash automáticamente al inicializarse,
    así que lo guardamos en sessionStorage para que React pueda leerlo.
  -->
  <script>
    (function() {
      var h = window.location.hash;
      if (h && (h.indexOf('type=invite') !== -1 || h.indexOf('type=recovery') !== -1 || h.indexOf('type=signup') !== -1)) {
        sessionStorage.setItem('dg_auth_hash', h);
      }
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
